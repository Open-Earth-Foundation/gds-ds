name: Release

# Opens or updates a "Version packages" pull request from pending changesets; publishes to
# GitHub Packages (npm.pkg.github.com, scope @open-earth-foundation) when that pull request is
# merged. The workflow's own GITHUB_TOKEN is enough to publish; no extra secret.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@open-earth-foundation'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'Version packages'
          commit: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A new version is out: tell the Prototype Lab (gcom-ds-prototype-lab), which imports it and opens its own pull
      # request. Without the secret, or if the call fails, nothing breaks here: the lab finds the version on its
      # daily check instead. The secret is a token that may write contents in that repository.
      - name: Tell the Prototype Lab
        if: steps.changesets.outputs.published == 'true'
        env:
          LAB_TOKEN: ${{ secrets.PROTOTYPE_LAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$LAB_TOKEN" ]; then
            echo "::notice::PROTOTYPE_LAB_DISPATCH_TOKEN is not set; the Prototype Lab picks this version up on its daily check."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $LAB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Open-Earth-Foundation/gcom-ds-prototype-lab/dispatches \
            -d '{"event_type":"gds-release"}' \
            || echo "::warning::Could not tell the Prototype Lab; it picks this version up on its daily check."
