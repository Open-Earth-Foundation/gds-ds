name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      # Token rules first: tiers, light/dark parity, namespace, naming, contrast. Nothing else runs if this fails.
      - run: pnpm check

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

      - name: Build Storybook
        run: pnpm --filter @oef/gds-react build-storybook --quiet

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/react/storybook-static
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: tokens-dist
          path: packages/tokens/dist
          retention-days: 14
